name: Scrape DTEK schedule

# Скрейпинг крутиться НА раннері GitHub (його IP Imperva/Incapsula не блокує, на
# відміну від домашнього/Pi) і публікує schedule.json у гілку `data`. Pi читає цю
# гілку через raw.githubusercontent.com (публічний репо, без токена).
on:
  # ОСНОВНИЙ драйвер — зовнішній пінг із Pi (cron на Pi раз на 15 хв шле
  # repository_dispatch, event_type: scrape). Так запуски регулярні, бо власний
  # schedule-cron GitHub ганяє нерегулярно (той самий підхід, що в mr-devboy).
  repository_dispatch:
    types: [scrape]
  # ЗАПАСНИЙ драйвер на випадок, якщо Pi недоступний. GitHub тримає цей cron
  # best-effort (часто із затримкою) — тому це лише підстраховка, не основа.
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}  # ручний запуск з вкладки Actions

# Два паралельні запуски перезаписували б гілку data один одному.
concurrency:
  group: scrape-dtek
  cancel-in-progress: false

permissions:
  contents: write  # щоб запушити schedule.json у гілку data
  actions: write  # щоб крок keep-alive нижче міг увімкнути workflow

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10  # зависла сторінка не має їсти годинник раннера
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Раннер щоразу чистий, тож без кешу Chromium (~150 МБ) качався б із CDN на
      # кожному запуску. Ключ — хеш requirements.txt: нова версія playwright -> новий
      # браузер. Системні бібліотеки (install-deps) кешувати не можна — це apt.
      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: python -m playwright install chromium
      - run: python -m playwright install-deps chromium

      - name: Scrape
        run: python scraper.py --region kr --out schedule.json --raw-out raw_fact.json

      # Гілка data — завжди РІВНО один коміт: orphan + push --force. Історія графіків
      # нікому не потрібна, а коміт на кожен запуск роздував би репозиторій.
      # Пушимо щоразу, навіть без змін у графіку: updated_at — це "пульс" містка,
      # по ньому Pi відрізняє живий скрейпер від мертвого (max_age_minutes).
      - name: Publish to data branch
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Порожній індекс + лише два файли: коміт містить тільки їх, а робоча тека
          # лишається цілою (post-кроки кешу ще читають requirements.txt).
          git checkout --orphan data-publish
          git rm -rfq --cached .
          git add -f schedule.json raw_fact.json
          git commit -qm "chore: update schedule $(date -u +%FT%TZ)"
          git push --force origin HEAD:data

      - name: Keep workflow enabled
        # GitHub вимикає заплановані workflow після 60 днів "неактивності"
        # (пуші бота в data не рахуються). Цей крок на кожному запуску вмикає
        # workflow назад через штатний GITHUB_TOKEN — без PAT. if: always() —
        # щоб відпрацьовував навіть коли скрейп/публікація впали.
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT "repos/${{ github.repository }}/actions/workflows/schedule.yml/enable"
